# fly.toml app configuration file generated for vexdex on 2026-08-29T01:01:45-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vexdex'
primary_region = 'iad'

[build]

[deploy]
  # Create/upgrade the schema once per release instead of on every machine
  # boot or worker fork. api.py no longer runs ensure_schema at import.
  release_command = "python -c \"import db; db.ensure_schema(db.get_engine())\""

[http_service]
  internal_port = 8080
  force_https = true
  # Keep at least one machine warm so the Elapse app never eats a cold start;
  # still let Fly stop the extras when idle.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.http_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'get'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
